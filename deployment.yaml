apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-set02
  labels:
    app: lab-set02
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-set02
  template:
    metadata:
      labels:
        app: lab-set02
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
